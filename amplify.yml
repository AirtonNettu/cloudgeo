version: 1
frontend:
  phases:
    build:
      commands: []
  artifacts:
    baseDirectory: .
    files:
      - 'index.html'
      - 'style.css'
      - 'app.js'
      - 'data-filters.js'
      - 'customHttp.yml'
      - 'dados/**/*'
      - 'vendor/**/*'
      - 'docs/architecture/**/*'
    exclude:
      - 'tests/**/*'
      - 'scripts/**/*'
      - '.github/**/*'
      - 'node_modules/**/*'
      - 'playwright.config.js'
      - 'package.json'
      - 'package-lock.json'
